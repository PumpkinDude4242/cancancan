<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="CAN Clicker 2025 - Supportez votre equipe africaine preferee pour la Coupe d'Afrique des Nations au Maroc !">
    <meta name="theme-color" content="#1a1a2e">

    <!-- Open Graph pour partage viral -->
    <meta property="og:title" content="CAN Clicker 2025">
    <meta property="og:description" content="Cliquez pour soutenir votre equipe ! Qui sera le champion de la CAN 2025 ?">
    <meta property="og:type" content="website">

    <title>CAN Clicker 2025 - Coupe d'Afrique des Nations</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body data-background="stadium">

    <!-- ============================================= -->
    <!-- ECRAN DE CHARGEMENT                          -->
    <!-- ============================================= -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-trophy">🏆</div>
            <h1>CAN CLICKER 2025</h1>
            <p>Chargement des equipes...</p>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- HEADER MINIMAL (Fixed)                       -->
    <!-- ============================================= -->
    <header id="header">
        <div class="header-left">
            <span class="logo">🏆</span>
            <h1 class="title">CAN 2025</h1>
        </div>
        <div class="header-center">
            <div class="live-indicator" id="live-indicator">
                <span class="live-dot"></span>
                <span id="live-match-text">Aucun match en direct</span>
            </div>
        </div>
        <div class="header-right">
            <div class="users-count">
                <span class="user-icon">👥</span>
                <span id="users-count">0</span>
            </div>
        </div>
    </header>

    <!-- ============================================= -->
    <!-- MONDE DU JEU (Scrollable horizontalement)    -->
    <!-- ============================================= -->
    <div id="world-viewport">
        <div id="world-container">
            <!-- Sol / Base ou les barres sont posees -->
            <div id="ground">
                <!-- Les barres seront generees dynamiquement ici -->
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- UI FIXE (Overlay)                            -->
    <!-- ============================================= -->
    <div id="game-ui">
        <!-- Conteneur des gouttes (pays hors ecran) -->
        <div id="drops-container">
            <!-- Les gouttes seront generees dynamiquement -->
        </div>

        <!-- Indicateur du leader avec sous-titre -->
        <div id="leader-indicator">
            <div class="leader-main">
                <span class="leader-crown">👑</span>
                <span id="leader-name">-</span>
                <span id="leader-score">0</span>
            </div>
            <div class="leader-subtitle">Qui va gagner la CAN !</div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- EFFETS DE CLIC (+1 flottants)               -->
    <!-- ============================================= -->
    <div id="click-effects"></div>

    <!-- ============================================= -->
    <!-- NOTIFICATIONS TOAST                          -->
    <!-- ============================================= -->
    <div id="toast-container"></div>

    <!-- ============================================= -->
    <!-- OVERLAY COMBO MODE                           -->
    <!-- ============================================= -->
    <div id="combo-overlay" class="hidden">
        <span class="combo-text">🔥 COMBO 🔥</span>
    </div>

    <!-- ============================================= -->
    <!-- SCRIPTS                                      -->
    <!-- ============================================= -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
