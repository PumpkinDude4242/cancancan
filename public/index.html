<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="CAN Clicker - Supportez votre équipe africaine préférée !">
    <meta name="theme-color" content="#1a1a2e">

    <!-- Open Graph pour partage viral -->
    <meta property="og:title" content="CAN Clicker Game">
    <meta property="og:description" content="Cliquez pour soutenir votre équipe ! Qui sera le champion ?">
    <meta property="og:type" content="website">

    <title>CAN Clicker - Coupe d'Afrique des Nations</title>

    <!-- Préchargement des ressources critiques -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">

    <!-- Favicons (à remplacer avec de vrais assets) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>
<body data-background="stadium">
    <!-- ============================================= -->
    <!-- ÉCRAN DE CHARGEMENT                          -->
    <!-- ============================================= -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-trophy">🏆</div>
            <h1>CAN CLICKER</h1>
            <p>Chargement des équipes...</p>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- HEADER / BARRE DE STATUT                     -->
    <!-- ============================================= -->
    <header id="header">
        <div class="header-left">
            <span class="logo">🏆</span>
            <h1 class="title">CAN CLICKER</h1>
        </div>
        <div class="header-center">
            <div class="live-indicator" id="live-indicator">
                <span class="live-dot"></span>
                <span id="live-match-text">Aucun match en direct</span>
            </div>
        </div>
        <div class="header-right">
            <div class="users-count">
                <span class="user-icon">👥</span>
                <span id="users-count">0</span>
            </div>
        </div>
    </header>

    <!-- ============================================= -->
    <!-- CONTENEUR PRINCIPAL DU JEU                   -->
    <!-- ============================================= -->
    <main id="game-container">
        <!-- Zone des barres (scrollable virtuellement via caméra) -->
        <div id="bars-viewport">
            <div id="bars-container">
                <!-- Les barres seront générées dynamiquement par JS -->
            </div>
        </div>

        <!-- Zone des "gouttes" pour équipes à la traîne -->
        <div id="drops-container">
            <!-- Les gouttes seront générées dynamiquement -->
        </div>
    </main>

    <!-- ============================================= -->
    <!-- BARRE DE STAMINA                             -->
    <!-- ============================================= -->
    <div id="stamina-bar-container">
        <div class="stamina-label">
            <span>⚡ ÉNERGIE</span>
            <span id="stamina-text">100%</span>
        </div>
        <div id="stamina-bar">
            <div id="stamina-fill"></div>
        </div>
        <div id="stamina-warning" class="hidden">
            ⏳ Récupération en cours...
        </div>
    </div>

    <!-- ============================================= -->
    <!-- PANNEAU DE SÉLECTION D'ÉQUIPE               -->
    <!-- ============================================= -->
    <div id="team-selector" class="hidden">
        <div class="selector-header">
            <h2>🌍 Choisissez votre équipe</h2>
            <p>Sélectionnez le pays que vous souhaitez soutenir</p>
        </div>
        <div id="teams-grid">
            <!-- Généré dynamiquement -->
        </div>
    </div>

    <!-- ============================================= -->
    <!-- BOUTON DE CLIC (équipe sélectionnée)        -->
    <!-- ============================================= -->
    <div id="click-zone" class="hidden">
        <button id="click-button" disabled>
            <div class="click-flag" id="click-flag"></div>
            <div class="click-info">
                <span class="click-team-name" id="click-team-name">Sélectionnez</span>
                <span class="click-score" id="click-score">0</span>
            </div>
        </button>
        <button id="change-team-btn" title="Changer d'équipe">🔄</button>
    </div>

    <!-- ============================================= -->
    <!-- CONTENEUR DES ANIMATIONS DE CLIC (+1)       -->
    <!-- ============================================= -->
    <div id="click-effects-container"></div>

    <!-- ============================================= -->
    <!-- PANNEAU DU CLASSEMENT (toggle)              -->
    <!-- ============================================= -->
    <div id="ranking-panel" class="hidden">
        <div class="panel-header">
            <h2>🏅 Classement</h2>
            <button id="close-ranking" class="close-btn">✕</button>
        </div>
        <div id="ranking-list">
            <!-- Généré dynamiquement -->
        </div>
    </div>

    <!-- Bouton pour ouvrir le classement -->
    <button id="ranking-toggle" title="Voir le classement">
        🏅
    </button>

    <!-- ============================================= -->
    <!-- NOTIFICATION TOAST                           -->
    <!-- ============================================= -->
    <div id="toast-container"></div>

    <!-- ============================================= -->
    <!-- OVERLAY COMBO MODE                           -->
    <!-- ============================================= -->
    <div id="combo-overlay" class="hidden">
        <span class="combo-text">🔥 COMBO MODE 🔥</span>
    </div>

    <!-- ============================================= -->
    <!-- SCRIPTS                                      -->
    <!-- ============================================= -->
    <!-- Socket.io depuis le serveur -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Logique client -->
    <script src="client.js"></script>
</body>
</html>
